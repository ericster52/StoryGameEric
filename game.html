<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play | The Last Light</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script src="script.js" defer></script>
</head>

<body>
    <nav class="navbar navbar-expand-md site-navbar" data-bs-theme="dark" aria-label="Main navigation">
        <div class="container">
            <a class="navbar-brand" href="index.html">The Last Light</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#main-nav"
                aria-controls="main-nav" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="main-nav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="game.html">Play the game</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About the creator</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="heading py-4">
        <div class="container">
            <div class="row align-items-center g-4">
                <div class="col-md-6">
                    <h1 class="display-5 fw-bold">The Last Light</h1>
                    <p class="lead mb-0">A mystery story by Eric Truong</p>
                </div>

                <div class="col-md-6">
                    <div class="row g-3">
                        <div class="col-6">
                            <img
                                src="https://images.pexels.com/photos/30214896/pexels-photo-30214896/free-photo-of-scenic-lighthouse-on-rocky-cliffs-by-ocean.jpeg?auto=compress&amp;fit=crop&amp;w=400&amp;h=224"
                                alt="A lighthouse above a rocky cliff."
                                width="200"
                                height="112"
                                class="img-fluid rounded shadow-sm w-100"
                            >
                        </div>

                        <div class="col-6">
                            <img
                                src="https://images.pexels.com/photos/27420659/pexels-photo-27420659/free-photo-of-a-lighthouse-and-waves-crashing-on-the-shore.jpeg?auto=compress&amp;fit=crop&amp;w=400&amp;h=224"
                                alt="Waves breaking over rocks along the shore."
                                width="200"
                                height="112"
                                class="img-fluid rounded shadow-sm w-100"
                            >
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container py-4 py-md-5">
        <!-- Story takes 8 columns and player status takes 4. -->
        <div class="row g-4 align-items-start">
            <div class="col-lg-8">
                <article class="card shadow-sm">
                    <div class="card-body p-4">
                        <header class="mb-3">
                            <h2
                                id="scene-title"
                                class="card-title"
                                tabindex="-1"
                            ></h2>

                            <h3
                                id="character-name"
                                class="h6 text-secondary"
                            ></h3>
                        </header>

                        <section aria-label="Story">
                            <p id="scene-text"></p>
                        </section>

                        <section aria-label="Choices" class="border-top pt-3">
                            <div id="choices-container" class="d-grid gap-2"></div>
                        </section>
                    </div>
                </article>
            </div>

            <aside class="col-lg-4" aria-labelledby="status-title">
                <div class="card shadow-sm">
                    <section class="card-body p-4" aria-label="Player status">
                        <h2 id="status-title" class="h4 card-title">
                            Player Status
                        </h2>

                        <p>
                            Energy:
                            <span id="health-display" class="badge text-bg-success">
                                100
                            </span>
                        </p>

                        <p class="mb-2">Inventory:</p>

                        <p>
                            <span id="inventory-display" class="badge inventory-badge">
                                Empty
                            </span>
                        </p>

                        <p id="message-display" role="status" class="fw-bold"></p>

                        <a href="game.html" class="btn btn-outline-primary w-100">
                            Start over
                        </a>
                    </section>
                </div>
            </aside>
        </div>

        <noscript>
            <p class="alert alert-warning mt-4">
                Please enable JavaScript to play the story.
            </p>
        </noscript>
    </main>

    <footer class="site-footer py-3 text-center">
        <div class="container">
            The Last Light by Eric Truong |
            <a href="about.html">About Eric</a>
        </div>
    </footer>
</body>
</html>
